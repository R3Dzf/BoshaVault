name: Build Lockvyn (Windows and Android)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      signed_release:
        description: 'Use permanent Android signing key (requires repository secrets)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  cloud-interop:
    name: Cloud encryption / .NET and Java compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch pinned JVM test dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-deps/java-cloud
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/org/bouncycastle/bcprov-jdk18on/1.86/bcprov-jdk18on-1.86.jar --output build-deps/bcprov.jar
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/org/json/json/20250517/json-20250517.jar --output build-deps/json.jar
          sha256sum --check <<'PINS'
          2af190b300cbb0b35e248ccf5f4a06b6072030aeb3da7a98ec73abe5b4cb371f  build-deps/bcprov.jar
          3ea61b2a06e31edf1c91134fe9106b0ebb16628be169f3db75bc7a2b06b45796  build-deps/json.jar
          PINS
      - name: Test cloud account and atomic merge, then generate synthetic fixtures
        run: |
          dotnet run --project src/BoshaVault.Tests -c Release -- --cloud-tests
          dotnet run --project src/BoshaVault.Tests -c Release -- --ux-tests
          dotnet run --project src/BoshaVault.Tests -c Release -- --fixtures build-deps/cloud-fixtures
          dotnet run --project src/BoshaVault.Tests -c Release -- --ux-fixtures build-deps/ux-fixtures
      - name: Validate cloud encryption and pairing in both directions
        shell: bash
        run: |
          set -euo pipefail
          javac -cp build-deps/bcprov.jar:build-deps/json.jar -d build-deps/java-cloud android/app/src/main/java/com/bosha/vault/VaultEngine.java android/app/src/main/java/com/bosha/vault/StrictJson.java android/app/src/main/java/com/bosha/vault/CloudAuth.java android/app/src/main/java/com/bosha/vault/CloudSnapshot.java android/app/src/main/java/com/bosha/vault/FolderCatalog.java android/app/src/main/java/com/bosha/vault/PasswordHealth.java android/app/src/main/java/com/bosha/vault/PasswordOptions.java tools/CloudAuthTest.java tools/CloudInteropTest.java tools/VaultUxInteropTest.java
          java -cp build-deps/java-cloud:build-deps/bcprov.jar:build-deps/json.jar com.bosha.vault.CloudAuthTest
          java -cp build-deps/java-cloud:build-deps/bcprov.jar:build-deps/json.jar com.bosha.vault.CloudInteropTest build-deps/cloud-fixtures
          dotnet run --project src/BoshaVault.Tests -c Release -- --verify-java-cloud build-deps/cloud-fixtures
          java -cp build-deps/java-cloud:build-deps/bcprov.jar:build-deps/json.jar com.bosha.vault.VaultUxInteropTest build-deps/ux-fixtures
          dotnet run --project src/BoshaVault.Tests -c Release -- --verify-java-ux build-deps/ux-fixtures

  windows:
    name: Windows x64 / .NET 10
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate local signing setup script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/Configure-AndroidSigning.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core, storage, and crypto tests
        run: dotnet run --project src/BoshaVault.Tests -c Release
      - name: Folder, review, deletion, migration and generator tests
        run: dotnet run --project src/BoshaVault.Tests -c Release -- --ux-tests
      - name: Desktop tests
        run: dotnet run --project src/BoshaVault.Tests -c Release -- --desktop-tests
      - name: Cloud account, pairing, atomic merge and DPAPI storage tests
        run: |
          dotnet run --project src/BoshaVault.Tests -c Release -- --cloud-tests
          dotnet run --project src/BoshaVault.Tests -c Release -- --cloud-store-tests
      - name: Certificate tests
        run: dotnet run --project src/BoshaVault.Tests -c Release -- --tls-certificate-tests
      - name: TLS / Schannel handshake test
        run: dotnet run --project src/BoshaVault.Tests -c Release -- --tls-handshake-tests
      - name: Publish Windows x64 executable
        run: >-
          dotnet publish src/BoshaVault.Windows
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output dist/windows
      - name: Publish native messaging host
        run: >-
          dotnet publish src/BoshaVault.NativeHost
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output dist/nativehost
      - name: Native Messaging binary protocol smoke test
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/Test-NativeHost.ps1 -Exe dist/nativehost/Lockvyn.NativeHost.exe
      - name: Validate Chrome and Edge extension JavaScript
        shell: pwsh
        run: |
          node --check browser-extension/background.js
          node --check browser-extension/content.js
          node --check browser-extension/password-utils.js
          node --check browser-extension/popup.js
          node tools/test-browser-generator.cjs
          node tools/test-browser-security.cjs
          node tools/test-browser-content.cjs
          Get-Content browser-extension/manifest.json -Raw | ConvertFrom-Json | Out-Null
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/Install-BrowserAutofill.ps1'),[ref]$tokens,[ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw "Autofill installer syntax invalid: $parseErrors" }
      - name: Bundle extension and native host with Windows
        shell: pwsh
        run: |
          Copy-Item 'dist/nativehost/Lockvyn.NativeHost.exe' 'dist/windows/Lockvyn.NativeHost.exe' -Force
          Copy-Item 'browser-extension' 'dist/windows/browser-extension' -Recurse -Force
          Copy-Item 'src/BoshaVault.Core/Assets/public_suffix_list.dat' 'dist/windows/public_suffix_list.dat' -Force
          $suffix = Get-Content 'dist/windows/public_suffix_list.dat' -Raw
          if (-not $suffix.Contains('BEGIN PRIVATE DOMAINS') -or -not $suffix.Contains('github.io')) { throw 'Offline private PSL data missing or invalid' }
          Copy-Item 'tools/Install-BrowserAutofill.ps1' 'dist/windows/Install-BrowserAutofill.ps1' -Force
          Copy-Item 'START-HERE.html' 'dist/windows/START-HERE.html' -Force
          if (!(Test-Path 'dist/windows/browser-extension/manifest.json')) { throw 'Extension missing from bundle' }
      - name: Test Chrome and Edge native host registration
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File dist/windows/Install-BrowserAutofill.ps1 -Browser Chrome -ExtensionId 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          powershell -NoProfile -ExecutionPolicy Bypass -File dist/windows/Install-BrowserAutofill.ps1 -Browser Edge -ExtensionId 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' -AppFolder dist/windows
          $hostManifest = Join-Path $env:LOCALAPPDATA 'BoshaVault/NativeMessaging/com.boshavault.desktop.json'
          $saved = Get-Content $hostManifest -Raw | ConvertFrom-Json
          if (@($saved.allowed_origins).Count -ne 2) { throw 'Expected two allowed browser extension origins' }
          if ($saved.path -notlike '*Lockvyn.NativeHost.exe') { throw 'Native host path missing' }
          $expectedHost = (Resolve-Path 'dist/windows/Lockvyn.NativeHost.exe').Path
          if ($saved.path -ne $expectedHost) { throw "Auto-detected AppFolder is incorrect: $($saved.path)" }
          $chromeReg=(Get-Item 'HKCU:/Software/Google/Chrome/NativeMessagingHosts/com.boshavault.desktop').GetValue('')
          $edgeReg=(Get-Item 'HKCU:/Software/Microsoft/Edge/NativeMessagingHosts/com.boshavault.desktop').GetValue('')
          if ($chromeReg -ne $hostManifest -or $edgeReg -ne $hostManifest) { throw 'Native host registry registration mismatch' }
      - name: Archive Windows build
        shell: pwsh
        run: Compress-Archive -Path 'dist/windows/*' -DestinationPath 'dist/Lockvyn-Windows-x64.zip' -Force
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Lockvyn-Windows-x64
          path: dist/Lockvyn-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android 9+ / SDK 35
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Android SDK 35 platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" || { echo 'sdkmanager not found under ANDROID_HOME'; exit 1; }
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and verify signed Android APK
        shell: bash
        env:
          SIGNED_RELEASE: ${{ (github.event_name == 'workflow_dispatch' && inputs.signed_release && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') }}
          STABLE_KEYSTORE_BASE64: ${{ ((github.event_name == 'workflow_dispatch' && inputs.signed_release && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')) && secrets.BOSHAVAULT_ANDROID_KEYSTORE_BASE64 || '' }}
          STABLE_KEYSTORE_PASSWORD: ${{ ((github.event_name == 'workflow_dispatch' && inputs.signed_release && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')) && secrets.BOSHAVAULT_ANDROID_KEYSTORE_PASSWORD || '' }}
          STABLE_KEY_ALIAS: ${{ ((github.event_name == 'workflow_dispatch' && inputs.signed_release && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')) && secrets.BOSHAVAULT_ANDROID_KEY_ALIAS || '' }}
        run: |
          set -euo pipefail
          STORE="$RUNNER_TEMP/boshavault-signing.p12"
          if [[ -n "$STABLE_KEYSTORE_BASE64" && -n "$STABLE_KEYSTORE_PASSWORD" && -n "$STABLE_KEY_ALIAS" ]]; then
            printf '%s' "$STABLE_KEYSTORE_BASE64" | base64 --decode > "$STORE"
            chmod 600 "$STORE"
            SIGNING_PASSWORD="$STABLE_KEYSTORE_PASSWORD"
            SIGNING_ALIAS="$STABLE_KEY_ALIAS"
            NOTICE='Signed with the project-provided signing certificate. Verify its certificate fingerprint before updating an installed app.'
          else
            if [[ "$SIGNED_RELEASE" == "true" ]]; then
              echo '::error::Signed releases require all three Android signing secrets. Refusing to release a temporary-key APK.'
              exit 1
            fi
            SIGNING_PASSWORD="$(openssl rand -hex 24)"
            SIGNING_ALIAS='boshavault-test'
            keytool -genkeypair -noprompt -alias "$SIGNING_ALIAS" -keyalg RSA -keysize 3072 -validity 7 -storetype PKCS12 -keystore "$STORE" -storepass "$SIGNING_PASSWORD" -keypass "$SIGNING_PASSWORD" -dname 'CN=Lockvyn CI test,O=Temporary build,C=US'
            NOTICE='TEMPORARY CI SIGNING KEY. This APK is only for installation/testing on a clean test device. It CANNOT upgrade an existing APK signed with a different certificate, and the signing key is discarded after this run. Never uninstall an existing vault without a verified encrypted backup.'
          fi
          BOSHAVAULT_KEYSTORE_PASSWORD="$SIGNING_PASSWORD" python tools/build-android.py --sdk "$ANDROID_HOME/platforms/android-35" --tools "$ANDROID_HOME/build-tools/35.0.0" --keystore "$STORE" --alias "$SIGNING_ALIAS"
          printf '%s\n' "$NOTICE" > dist/ANDROID-SIGNING-NOTICE.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/Lockvyn-Android-LegacyPackage.apk
          if [[ "$SIGNED_RELEASE" != "true" ]]; then
            BOSHAVAULT_KEYSTORE_PASSWORD="$SIGNING_PASSWORD" python tools/build-android.py --sdk "$ANDROID_HOME/platforms/android-35" --tools "$ANDROID_HOME/build-tools/35.0.0" --keystore "$STORE" --alias "$SIGNING_ALIAS" --isolated-test-app
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Lockvyn-Android.apk
          fi
          unset SIGNING_PASSWORD STABLE_KEYSTORE_PASSWORD STABLE_KEYSTORE_BASE64
      - name: Upload Lockvyn Android app (separate storage)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'workflow_dispatch' && inputs.signed_release) }}
        uses: actions/upload-artifact@v4
        with:
          name: Lockvyn-Android
          path: |
            dist/Lockvyn-Android.apk
            dist/ANDROID-SIGNING-NOTICE.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android APK and signing notice
        uses: actions/upload-artifact@v4
        with:
          name: Lockvyn-Android-LegacyPackage
          path: |
            dist/Lockvyn-Android-LegacyPackage.apk
            dist/ANDROID-SIGNING-NOTICE.txt
          if-no-files-found: error
          retention-days: 14

  android-ui:
    name: Android native keyboard and 1000-login navigation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable emulator acceleration and install SDK packages
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'emulator' 'system-images;android-35;google_apis;x86_64'
      - name: Build isolated app and matching-signed instrumentation
        shell: bash
        env:
          BOSHAVAULT_KEYSTORE_PASSWORD: boshavault-disposable-ui-test
        run: |
          set -euo pipefail
          mkdir -p build-deps
          keytool -genkeypair -keystore build-deps/ui-demo.p12 -storepass "$BOSHAVAULT_KEYSTORE_PASSWORD" -keypass "$BOSHAVAULT_KEYSTORE_PASSWORD" -alias boshavault -keyalg RSA -keysize 2048 -validity 7 -dname 'CN=Lockvyn Disposable UI Test'
          python tools/build-android.py --sdk "$ANDROID_HOME/platforms/android-35" --tools "$ANDROID_HOME/build-tools/35.0.0" --keystore build-deps/ui-demo.p12 --isolated-test-app
          python tools/build-android-ui-test.py --sdk "$ANDROID_HOME/platforms/android-35" --tools "$ANDROID_HOME/build-tools/35.0.0" --keystore build-deps/ui-demo.p12
      - name: Run native keyboard and scrolling acceptance tests
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/lockvyn-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          AVDMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name avdmanager -print -quit)"
          printf 'no\n' | "$AVDMANAGER" create avd --force --name LockvynUi --path "$ANDROID_AVD_HOME/LockvynUi.avd" --package 'system-images;android-35;google_apis;x86_64' --device 'pixel_2'
          test -f "$ANDROID_AVD_HOME/LockvynUi.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          "$ANDROID_HOME/emulator/emulator" -avd LockvynUi -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on > build-deps/emulator.log 2>&1 &
          BV_EMULATOR_PID=$!
          trap 'kill "$BV_EMULATOR_PID" || true' EXIT
          sleep 2
          kill -0 "$BV_EMULATOR_PID" || { cat build-deps/emulator.log; exit 1; }
          timeout 180 adb wait-for-device
          for attempt in $(seq 1 150); do
            kill -0 "$BV_EMULATOR_PID" || { cat build-deps/emulator.log; exit 1; }
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1' ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell settings put secure show_ime_with_hard_keyboard 1
          adb shell ime list -s
          adb shell settings get secure default_input_method
          adb shell input keyevent 82
          adb install dist/Lockvyn-Android.apk
          adb install dist/android/Lockvyn-UI-Test.apk
          adb shell am instrument -w com.bosha.vault.uismoke/com.bosha.vault.tests.UiSmoke | tee build-deps/native-ui.log
          python -c "from pathlib import Path; text=Path('build-deps/native-ui.log').read_text(); assert 'UI_SMOKE_PASS:' in text, text"
      - name: Upload native UI test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lockvyn-Android-UI-Logs
          path: |
            build-deps/native-ui.log
            build-deps/emulator.log
          if-no-files-found: ignore
          retention-days: 14
