name: Verify Windows release checksums

on:
  push:
    branches: ['maintenance/windows-checksums-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lockvyn-windows-release
  cancel-in-progress: false

jobs:
  checksums:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Require successful acceptance on this exact source commit
        uses: actions/github-script@v7
        with:
          script: |
            const result = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'build.yml', head_sha: context.sha, per_page: 100
            });
            if (!result.data.workflow_runs.some(r => r.head_sha === context.sha && r.conclusion === 'success')) {
              throw new Error('Run Build Lockvyn successfully on this exact commit before updating checksums.');
            }
      - name: Verify published files and update their checksum list
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version=([xml](Get-Content src/BoshaVault.Windows/BoshaVault.Windows.csproj -Raw)).Project.PropertyGroup.Version
          if ('${{ github.event_name }}' -eq 'push' -and '${{ github.ref_name }}' -ne "maintenance/windows-checksums-v$version") { throw 'Maintenance ref must match Windows Version.' }
          ./tools/Publish-WindowsChecksums.ps1 -Version $version -Repository '${{ github.repository }}'
