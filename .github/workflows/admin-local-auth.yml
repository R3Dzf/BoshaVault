name: Local Supabase Auth staging
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: free-admin-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Prepare disposable local Supabase configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ]; then
            supabase init --force
          fi
          # The local stack has TOTP disabled by default. Enable it ONLY in
          # this disposable runner so real AAL2 sessions can be tested.
          python3 - <<'PY'
          from pathlib import Path
          import re
          config = Path("supabase/config.toml")
          source = config.read_text()
          section = re.search(r"(?ms)^\[auth\.mfa\.totp\]\s*\n(.*?)(?=^\[|\Z)", source)
          if section:
              updated = section.group(0)
              for key in ("enroll_enabled", "verify_enabled"):
                  if re.search(rf"(?m)^{key}\s*=", updated):
                      updated = re.sub(rf"(?m)^({key}\s*=).*$", r"\g<1> true", updated)
                  else:
                      updated += f"\n{key} = true\n"
              source = source[:section.start()] + updated + source[section.end():]
          else:
              source += "\n[auth.mfa.totp]\nenroll_enabled = true\nverify_enabled = true\n"
          config.write_text(source)
          assert "[auth.mfa.totp]" in source
          print("Enabled TOTP only in disposable local staging")
          PY
      - name: Start local self-hosted Supabase Auth (no cloud project)
        shell: bash
        run: |
          set -euo pipefail
          supabase start
          supabase status -o json > "$RUNNER_TEMP/local-supabase.json"
          node -e 'const x=require(process.argv[1]);if(!x.API_URL?.startsWith("http://127.0.0.1:"))process.exit(1)' "$RUNNER_TEMP/local-supabase.json"
      - name: Run synthetic RLS fixtures against locally applied migrations
        shell: bash
        run: |
          set -euo pipefail
          container="$(docker ps --filter name=supabase_db_ --format '{{.ID}}' | head -n 1)"
          if [ -z "$container" ]; then echo 'No local Postgres container'; exit 1; fi
          # supabase start already applied the repository migrations in timestamp order.
          docker exec -i "$container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/owner_isolation.sql
          docker exec -i "$container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/mfa_enforcement.sql
          docker exec -i "$container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/cloud_device_registry.sql
          docker exec -i "$container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/admin_device_access.sql
      - name: Start real local Edge Function
        shell: bash
        run: |
          set -euo pipefail
          supabase functions serve lockvyn-admin --no-verify-jwt > "$RUNNER_TEMP/local-edge.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/local-edge.pid"
          for n in $(seq 1 50); do
            status="$(curl --max-time 2 --silent --output /dev/null --write-out '%{http_code}' 'http://127.0.0.1:54321/functions/v1/lockvyn-admin' || true)"
            if [ "$status" = "200" ]; then echo "Local function ready"; exit 0; fi
            sleep 2
          done
          echo 'Local function did not start'
          sed -E 's/(Bearer |service_role[ =:]+)[^ ]+/\1[REDACTED]/g' "$RUNNER_TEMP/local-edge.log" | tail -n 60
          exit 1
      - name: Test real user + verified MFA access against local GoTrue
        shell: bash
        run: node tools/test_admin_local_auth.mjs "$RUNNER_TEMP/local-supabase.json"
      - name: Tear down free local containers
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/local-edge.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/local-edge.pid")" || true
          fi
          supabase stop --no-backup || true
