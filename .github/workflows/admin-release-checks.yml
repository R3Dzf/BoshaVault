name: Admin and release checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check security and release contracts
        run: python tools/test_admin_release.py
      - name: Check verified admin AAL2 and allowlist decisions
        run: node tools/test-admin-access.cjs
      - name: Test real admin handler using free synthetic runtime
        run: node tools/test-admin-handler.cjs
      - name: Verify admin roadmap order
        run: python tools/test_admin_phases.py
      - name: Verify unauthorized admin requests are rejected
        run: python tools/test_admin_denials.py
      - name: Verify published admin HTML (read-only)
        run: node tools/test_admin_live_ui.mjs
