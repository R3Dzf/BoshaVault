name: Release Lockvyn Android
on:
  push:
    tags: ['android-v*']
    branches: ['release/android-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the permanently signed Android release'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: lockvyn-android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Require successful acceptance on this exact source commit
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({...context.repo, workflow_id:'build.yml', head_sha:context.sha, per_page:100});
            if (!runs.data.workflow_runs.some(r => r.head_sha===context.sha && r.conclusion==='success')) throw new Error('Run Build Lockvyn successfully on this exact commit before releasing.');
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build canonical APK with the permanent signing identity
        shell: bash
        env:
          SIGNING_STORE: ${{ secrets.BOSHAVAULT_ANDROID_KEYSTORE_BASE64 }}
          BOSHAVAULT_KEYSTORE_PASSWORD: ${{ secrets.BOSHAVAULT_ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.BOSHAVAULT_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          VERSION=$(python -c "import json;print(json.load(open('android/version.json'))['versionName'])")
          if [[ '${{ github.event_name }}' == 'push' && '${{ github.ref_name }}' != "release/android-v$VERSION" && '${{ github.ref_name }}' != "android-v$VERSION" ]]; then echo '::error::Release ref differs from Android version'; exit 1; fi
          test -n "$SIGNING_STORE" && test -n "$BOSHAVAULT_KEYSTORE_PASSWORD" && test -n "$SIGNING_ALIAS" || { echo '::error::Production signing configuration requires the repository owner. Temporary signing is never used for releases.'; exit 1; }
          STORE="$RUNNER_TEMP/lockvyn-release.p12"
          trap 'rm -f "$STORE" "$RUNNER_TEMP/lockvyn-signer.der"' EXIT
          umask 077
          printf '%s' "$SIGNING_STORE" | base64 --decode > "$STORE"
          # Do not publish a short-lived test certificate accidentally stored as a secret.
          keytool -exportcert -keystore "$STORE" -storepass:env BOSHAVAULT_KEYSTORE_PASSWORD -alias "$SIGNING_ALIAS" -file "$RUNNER_TEMP/lockvyn-signer.der"
          openssl x509 -inform DER -in "$RUNNER_TEMP/lockvyn-signer.der" -checkend 31536000 -noout
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          python tools/build-android.py --sdk "$ANDROID_HOME/platforms/android-35" --tools "$ANDROID_HOME/build-tools/35.0.0" --keystore "$STORE" --alias "$SIGNING_ALIAS" --lockvyn-package
          echo "ANDROID_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Verify signature continuity and create public update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/android-release-metadata.py --tools "$ANDROID_HOME/build-tools/35.0.0" --repository '${{ github.repository }}'
      - name: Publish APK, update metadata, checksums and customer instructions
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          set -euo pipefail
          TAG="android-v$ANDROID_VERSION"
          test -f "docs/releases/Lockvyn-Android-$ANDROID_VERSION.md"
          OPTIONS=(--repo '${{ github.repository }}' --target '${{ github.sha }}' --title "Lockvyn $ANDROID_VERSION — Android" --notes-file "docs/releases/Lockvyn-Android-$ANDROID_VERSION.md")
          if [[ "$PUBLISH" != 'true' ]]; then OPTIONS+=(--draft); fi
          gh release create "$TAG" dist/Lockvyn-Android.apk dist/android-update.json dist/SHA256SUMS-Android.txt "${OPTIONS[@]}"
      - name: Retain public release assets
        uses: actions/upload-artifact@v4
        with:
          name: Lockvyn-Android-release
          path: |
            dist/Lockvyn-Android.apk
            dist/android-update.json
            dist/SHA256SUMS-Android.txt
          if-no-files-found: error
          retention-days: 14
